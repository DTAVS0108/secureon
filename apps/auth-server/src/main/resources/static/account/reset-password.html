<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password · SecureOne</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #171717;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 8px;
        font-size: 0.875rem;
      }
      .ok {
        background: #ecfdf5;
        color: #065f46;
      }
      .err {
        background: #fef2f2;
        color: #991b1b;
      }
    </style>
    <script src="/account/password-policy-ui.js"></script>
    <script src="/account/i18n.js"></script>
    <script src="/account/hosted.js"></script>
  </head>
  <body>
    <h1>Reset your password</h1>
    <p id="hint">Enter a new password that meets the requirements below.</p>
    <div id="checklist"></div>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" required autocomplete="new-password" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" required autocomplete="new-password" />
      <button type="submit">Update password</button>
    </form>
    <div id="status"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token");
      const applicationId = params.get("applicationId");
      const form = document.getElementById("form");
      const status = document.getElementById("status");
      const passwordInput = document.getElementById("password");
      const checklist = document.getElementById("checklist");
      let policy = { minLength: 12, requireUppercase: false, requireNumber: false, requireSymbol: false };

      if (!token) {
        form.style.display = "none";
        document.getElementById("hint").style.display = "none";
        status.className = "msg err";
        status.textContent = "Missing reset token. Use the link from your email.";
      } else {
        SecureOnePasswordPolicy.loadPolicy(applicationId).then(function (p) {
          policy = p;
          SecureOnePasswordPolicy.bindPasswordField(passwordInput, checklist, policy);
        });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = passwordInput.value;
        const confirm = document.getElementById("confirm").value;
        if (password !== confirm) {
          status.className = "msg err";
          status.textContent = "Passwords do not match.";
          return;
        }
        if (!SecureOnePasswordPolicy.meetsPolicy(password, policy)) {
          status.className = "msg err";
          status.textContent = "Password does not meet all requirements.";
          return;
        }
        status.textContent = "Updating…";
        status.className = "msg";
        try {
          const res = await fetch("/api/v1/account/password/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.detail || data.message || "Reset failed");
          }
          form.style.display = "none";
          document.getElementById("hint").style.display = "none";
          checklist.style.display = "none";
          status.className = "msg ok";
          status.textContent = data.message || "Password updated. You can sign in now.";
        } catch (err) {
          status.className = "msg err";
          status.textContent = err.message || "Reset failed";
        }
      });
    </script>
  </body>
</html>
