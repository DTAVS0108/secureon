<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password · SecureOne</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
      label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
      input, select { width: 100%; padding: 0.5rem 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
      button { width: 100%; padding: 0.6rem; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
      .msg { margin-top: 1rem; padding: 0.75rem; border-radius: 8px; font-size: 0.875rem; }
      .ok { background: #ecfdf5; color: #065f46; }
      .err { background: #fef2f2; color: #991b1b; }
      .hidden { display: none; }
    </style>
    <script src="/account/i18n.js"></script>
    <script src="/account/hosted.js"></script>
  </head>
  <body>
    <h1>Forgot password</h1>
    <p id="intro">Enter your email or phone to reset your password.</p>
    <form id="form">
      <label for="identifier">Email or phone (E.164)</label>
      <input id="identifier" type="text" required autocomplete="username" placeholder="Email or phone number" />
      <div id="modeRow" class="hidden">
        <label for="mode">Reset method</label>
        <select id="mode">
          <option value="link">Email link</option>
          <option value="otp">OTP code</option>
        </select>
      </div>
      <div id="channelRow" class="hidden">
        <label for="channel">Send code via</label>
        <select id="channel">
          <option value="email">Email</option>
          <option value="phone">SMS</option>
        </select>
      </div>
      <button type="submit" id="submitBtn">Send reset instructions</button>
    </form>
    <div id="otpStep" class="hidden">
      <p>Enter the code we sent and choose a new password.</p>
      <label for="code">Verification code</label>
      <input id="code" type="text" inputmode="numeric" maxlength="8" />
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" />
      <button type="button" id="resetOtpBtn">Update password</button>
    </div>
    <div id="status"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const applicationId = params.get("applicationId");
      const form = document.getElementById("form");
      const status = document.getElementById("status");
      const intro = document.getElementById("intro");
      let challengeId = null;
      let recoveryPolicy = null;

      if (!applicationId) {
        form.style.display = "none";
        intro.textContent = "Missing applicationId in the URL.";
        status.className = "msg err";
        status.textContent = "Add ?applicationId=… to the URL.";
      } else {
        fetch("/api/v1/applications/" + encodeURIComponent(applicationId) + "/signup")
          .then((r) => r.json())
          .then((data) => {
            recoveryPolicy = data.verification?.recovery || {};
            const modes = recoveryPolicy.allowedModes || ["link"];
            const channels = recoveryPolicy.allowedChannels || ["email"];
            if (modes.length > 1) document.getElementById("modeRow").classList.remove("hidden");
            const modeSelect = document.getElementById("mode");
            modeSelect.value = recoveryPolicy.passwordResetMode || "link";
            if (channels.length > 1 && recoveryPolicy.allowUserChannelChoice !== false) {
              document.getElementById("channelRow").classList.remove("hidden");
            }
            modeSelect.addEventListener("change", () => {
              document.getElementById("channelRow").classList.toggle("hidden", modeSelect.value !== "otp");
            });
            if (modeSelect.value === "otp") document.getElementById("channelRow").classList.remove("hidden");
          })
          .catch(() => {});
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        status.textContent = "Sending…";
        status.className = "msg";
        const body = {
          identifier: document.getElementById("identifier").value.trim(),
          mode: document.getElementById("mode").value,
        };
        // Only send a channel when the user could choose one; otherwise the policy picks it.
        if (!document.getElementById("channelRow").classList.contains("hidden")) {
          body.channel = document.getElementById("channel").value;
        }
        const res = await fetch(
          "/api/v1/applications/" + encodeURIComponent(applicationId) + "/account/password/forgot",
          { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          status.className = "msg err";
          status.textContent = data.detail || data.message || "Request failed";
          return;
        }
        status.className = "msg ok";
        status.textContent = data.message || "Check your email or phone if an account exists.";
        if (data.mode === "otp" && data.challengeId) {
          challengeId = data.challengeId;
          form.classList.add("hidden");
          document.getElementById("otpStep").classList.remove("hidden");
        }
      });

      document.getElementById("resetOtpBtn").addEventListener("click", async () => {
        if (!challengeId) return;
        status.textContent = "Updating…";
        const res = await fetch(
          "/api/v1/applications/" + encodeURIComponent(applicationId) + "/account/password/reset/otp",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              challengeId,
              code: document.getElementById("code").value.trim(),
              password: document.getElementById("newPassword").value,
            }),
          }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          status.className = "msg err";
          status.textContent = data.detail || data.message || "Reset failed";
          return;
        }
        status.className = "msg ok";
        status.textContent = data.message || "Password updated. You can sign in now.";
      });
    </script>
  </body>
</html>
