<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic link · SecureOne</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 24rem; margin: 3rem auto; padding: 0 1rem; }
      label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
      input { width: 100%; padding: 0.5rem 0.75rem; margin-bottom: 1rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
      button { width: 100%; padding: 0.6rem; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-weight: 600; }
      .err { color: #991b1b; font-size: 0.875rem; }
    </style>
    <script src="/account/i18n.js"></script>
    <script src="/account/hosted.js"></script>
  </head>
  <body>
    <h1>Magic link sign-in</h1>
    <p id="intro">Enter your email to receive a one-time sign-in link.</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />
      <button type="submit">Send sign-in link</button>
    </form>
    <p id="status"></p>
    <script>
      const params = new URLSearchParams(location.search);
      const applicationId = params.get("applicationId");
      if (params.get("token")) {
        // The app the link was sent for decides whether a second step is needed.
        location.href = "/api/v1/account/magic-link/verify?token=" + encodeURIComponent(params.get("token"))
          + (params.get("applicationId") ? "&applicationId=" + encodeURIComponent(params.get("applicationId")) : "");
      }
      if (!applicationId) {
        document.getElementById("form").style.display = "none";
        document.getElementById("intro").textContent = "Missing applicationId in the URL.";
        document.getElementById("status").className = "err";
        document.getElementById("status").textContent = "Add ?applicationId=… to the URL.";
      }
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await fetch(
          "/api/v1/applications/" + encodeURIComponent(applicationId) + "/account/magic-link/request",
          {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ email: document.getElementById("email").value }),
          }
        );
        const data = await res.json().catch(() => ({}));
        document.getElementById("status").textContent = data.message || "Check your email if an account exists.";
      });
    </script>
  </body>
</html>
