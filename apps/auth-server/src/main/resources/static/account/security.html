<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account security · SecureOne</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 38rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #111;
      }
      h1 { font-size: 1.35rem; margin-bottom: 0.25rem; }
      h2 { font-size: 1.1rem; }
      h3 { font-size: 0.95rem; margin: 1.25rem 0 0.25rem; }
      .muted { color: #666; font-size: 0.875rem; }
      section { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #e5e7eb; }
      button {
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: #fff;
        cursor: pointer;
        font-weight: 600;
        margin: 0.25rem 0.25rem 0.25rem 0;
      }
      .banner { margin: 1rem 0; padding: 0.75rem; border-radius: 8px; font-size: 0.875rem; }
      .banner.error { background: #fef2f2; color: #991b1b; }
      .banner.ok { background: #ecfdf5; color: #065f46; }
      ul.sessions { list-style: none; padding: 0; margin: 0.75rem 0; }
      ul.sessions li { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f3f4f6; }
      input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; margin: 0.5rem 0; }
      code { font-size: 0.8rem; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Account security</h1>
    <p class="muted">Two-step verification, signed-in sessions and your data. You must be signed in.</p>
    <div id="banner" class="banner" hidden></div>

    <section>
      <h2>Two-step verification</h2>
      <div id="two-step" data-testid="two-step-account"></div>
    </section>

    <section>
      <h2>Sessions</h2>
      <ul id="sessions" class="sessions"></ul>
      <button type="button" id="revoke-others">Sign out other devices</button>
    </section>

    <section>
      <h2>Privacy</h2>
      <p class="muted">Export personal data or request account deletion (GDPR/CCPA).</p>
      <p>
        <a href="/account/privacy.html">Privacy & data portal</a>
        · <a id="login-link" href="/login.html">Sign in</a>
        · <a href="/account/forgot-password.html">Forgot password</a>
      </p>
    </section>

    <script src="/account/two-step.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const applicationId = params.get("applicationId");

      function showBanner(text, ok) {
        const el = document.getElementById("banner");
        el.textContent = text;
        el.className = "banner " + (ok ? "ok" : "error");
        el.hidden = false;
      }

      async function api(path, init) {
        const res = await fetch(path, {
          credentials: "same-origin",
          headers: { Accept: "application/json", "Content-Type": "application/json" },
          ...init,
        });
        if (res.status === 401) throw new Error("Sign in required.");
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || body.message || "Request failed");
        }
        if (res.status === 204) return null;
        return res.json();
      }

      async function loadSessions() {
        const data = await api("/api/v1/account/sessions");
        const ul = document.getElementById("sessions");
        ul.innerHTML = "";
        (data.sessions || []).forEach((s) => {
          const li = document.createElement("li");
          const label = document.createElement("span");
          label.textContent = `${s.current ? "Current session" : "Session"} · ${s.lastAccessedAt || s.createdAt}`;
          li.appendChild(label);
          if (!s.current) {
            const btn = document.createElement("button");
            btn.textContent = "Revoke";
            btn.onclick = async () => {
              await api(`/api/v1/account/sessions/${s.id}`, { method: "DELETE" });
              await loadSessions();
            };
            li.appendChild(btn);
          }
          ul.appendChild(li);
        });
      }

      document.getElementById("revoke-others").onclick = async () => {
        try {
          await api("/api/v1/account/sessions", { method: "DELETE" });
          await loadSessions();
          showBanner("Other sessions revoked.", true);
        } catch (e) { showBanner(e.message, false); }
      };

      if (applicationId) {
        document.getElementById("login-link").href = `/login.html?applicationId=${encodeURIComponent(applicationId)}`;
      }

      window.SecureOneTwoStep.renderAccount(document.getElementById("two-step"), { applicationId });
      loadSessions().catch((e) => showBanner(e.message, false));
    </script>
  </body>
</html>
