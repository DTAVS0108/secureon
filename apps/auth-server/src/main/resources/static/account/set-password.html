<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set password · SecureOne</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .msg {
        margin-top: 1rem;
        font-size: 0.875rem;
      }
      .err {
        color: #991b1b;
      }
      .ok {
        color: #065f46;
      }
    </style>
    <script src="/account/password-policy-ui.js"></script>
    <script src="/account/i18n.js"></script>
    <script src="/account/hosted.js"></script>
  </head>
  <body>
    <h1>Set your password</h1>
    <p>Choose a password that meets the requirements below.</p>
    <div id="checklist"></div>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" required autocomplete="new-password" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" required autocomplete="new-password" />
      <button type="submit">Save password</button>
    </form>
    <p id="status" class="msg"></p>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token");
      const applicationId = params.get("applicationId");
      const passwordInput = document.getElementById("password");
      const checklist = document.getElementById("checklist");
      const status = document.getElementById("status");
      let policy = { minLength: 12, requireUppercase: false, requireNumber: false, requireSymbol: false };

      if (!token) {
        document.getElementById("form").style.display = "none";
        status.className = "msg err";
        status.textContent = "Missing invite token. Use the link from your email.";
      } else {
        SecureOnePasswordPolicy.loadPolicy(applicationId).then(function (p) {
          policy = p;
          SecureOnePasswordPolicy.bindPasswordField(passwordInput, checklist, policy);
        });
      }

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = passwordInput.value;
        if (password !== document.getElementById("confirm").value) {
          status.className = "msg err";
          status.textContent = "Passwords do not match.";
          return;
        }
        if (!SecureOnePasswordPolicy.meetsPolicy(password, policy)) {
          status.className = "msg err";
          status.textContent = "Password does not meet all requirements.";
          return;
        }
        const res = await fetch("/api/v1/account/set-password", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            token,
            password,
            applicationId: applicationId || undefined,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          status.className = "msg err";
          status.textContent = data.detail || data.message || "Could not set password.";
          return;
        }
        status.className = "msg ok";
        status.textContent =
          (data.message || "Done") + (data.loginUsername ? " Login as: " + data.loginUsername : "");
      });
    </script>
  </body>
</html>
