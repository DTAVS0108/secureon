spring:
  application:
    name: auth-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SECUREONE_DB_URL:jdbc:postgresql://localhost:5432/secureone?currentSchema=platform}
    username: ${SECUREONE_DB_USERNAME:secureone}
    password: ${SECUREONE_DB_PASSWORD:secureone}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Tighten to "validate" once entities fully match migrations.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql

  data:
    redis:
      url: ${SECUREONE_REDIS_URL:redis://localhost:6379}

  session:
    store-type: redis
    redis:
      namespace: secureone:session
      repository-type: indexed

  # SMTP is configured in Platform settings → Notifications (stored in DB). Optional env override for local MailHog.
  mail:
    host: ${SECUREONE_SMTP_HOST:}
    port: ${SECUREONE_SMTP_PORT:1025}
    username: ${SECUREONE_SMTP_USERNAME:}
    password: ${SECUREONE_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SECUREONE_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SECUREONE_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

  # Dev login user (replace with real user store in Phase 1)
  security:
    user:
      name: ${SECUREONE_DEV_USER:admin}
      password: ${SECUREONE_DEV_PASSWORD:admin}
    oauth2:
      authorizationserver:
        issuer: ${SECUREONE_ISSUER_URL:http://localhost:9000}
        # OAuth clients are loaded from application records (admin Applications API).

server:
  port: ${SECUREONE_PORT:9000}

secureone:
  environment: ${SECUREONE_ENV:development}
  swagger-enabled: ${SECUREONE_SWAGGER_ENABLED:true}
  dev-auth-enabled: ${SECUREONE_DEV_AUTH_ENABLED:true}
  cors-allowed-origins: ${SECUREONE_CORS_ALLOWED_ORIGINS:}
  public-base-url: ${SECUREONE_PUBLIC_BASE_URL:http://localhost:9000}
  admin-web-url: ${SECUREONE_ADMIN_WEB_URL:http://localhost:3001}
  # When MailHog/SMTP is down, log verification/reset links to the auth-server console (dev only).
  mail:
    log-links-when-smtp-unavailable: ${SECUREONE_MAIL_LOG_WHEN_UNAVAILABLE:true}
  password-expiry:
    scheduler-enabled: ${SECUREONE_PASSWORD_EXPIRY_SCHEDULER:true}
    check-cron: ${SECUREONE_PASSWORD_EXPIRY_CRON:0 0 */6 * * *}
  otp:
    pepper: ${SECUREONE_OTP_PEPPER:change-me-in-production}
  password:
    breach-check-enabled: ${SECUREONE_BREACH_CHECK_ENABLED:true}
  rate-limit:
    enabled: ${SECUREONE_RATE_LIMIT_ENABLED:true}
    login-per-minute: ${SECUREONE_RATE_LIMIT_LOGIN_PER_MINUTE:20}
    token-per-minute: ${SECUREONE_RATE_LIMIT_TOKEN_PER_MINUTE:60}
    forgot-password-per-minute: ${SECUREONE_RATE_LIMIT_FORGOT_PASSWORD_PER_MINUTE:5}
    otp-request-per-minute: ${SECUREONE_RATE_LIMIT_OTP_REQUEST_PER_MINUTE:10}
    admin-login-per-minute: ${SECUREONE_RATE_LIMIT_ADMIN_LOGIN_PER_MINUTE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    mail:
      enabled: false

info:
  app:
    name: SecureOne Auth Server
    description: Centralized IAM platform — authorization server
    version: 0.0.1-SNAPSHOT

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Required when disable-swagger-default-url is true — springdoc 3.x may omit urls[] from swagger-config.
    url: /v3/api-docs/all
    urls-primary-name: all
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
    doc-expansion: list
    groups-order: ASC
    config-url: /v3/api-docs/swagger-config
  show-actuator: false
  writer-with-order-by-keys: true
