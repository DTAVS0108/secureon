spring:
  application:
    name: auth-server
  config:
    # Secrets as files (Docker / Kubernetes secrets): a file /run/secrets/SECUREONE_DB_PASSWORD sets that
    # setting like the environment variable would (which still wins). Missing directory: ignored. docs/24.
    import: optional:configtree:${SECUREONE_SECRETS_DIR:/run/secrets}/
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # @Async work (webhooks, back-channel logout, alerts): bounded, so a slow receiver cannot pile up threads or
  # memory. When full, the caller runs the task itself rather than losing it.
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 5000
      thread-name-prefix: secureone-async-

  datasource:
    url: ${SECUREONE_DB_URL:jdbc:postgresql://localhost:5432/secureone?currentSchema=platform}
    username: ${SECUREONE_DB_USERNAME:secureone}
    password: ${SECUREONE_DB_PASSWORD:secureone}
    hikari:
      # Every pooled connection: the RLS mode (V61, must match secureone.rls.enforce) and the
      # data-only role secureone_app (V63), which RLS policies always apply to. Superuser and
      # BYPASSRLS roles skip RLS entirely, so request queries must not run as the schema owner.
      connection-init-sql: >-
        SELECT set_config('app.rls_enforce', '${secureone.rls.enforce}', false);
        DO $$ BEGIN
          IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${SECUREONE_DB_APP_ROLE:secureone_app}') THEN
            EXECUTE 'SET ROLE ${SECUREONE_DB_APP_ROLE:secureone_app}';
          END IF;
        END $$

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Tighten to "validate" once entities fully match migrations.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    # Own connection as the schema owner (the pooled ones run as secureone_app, which cannot run DDL).
    url: ${SECUREONE_DB_URL:jdbc:postgresql://localhost:5432/secureone?currentSchema=platform}
    user: ${SECUREONE_DB_MIGRATION_USERNAME:${SECUREONE_DB_USERNAME:secureone}}
    password: ${SECUREONE_DB_MIGRATION_PASSWORD:${SECUREONE_DB_PASSWORD:secureone}}

  data:
    redis:
      url: ${SECUREONE_REDIS_URL:redis://localhost:6379}

  session:
    store-type: redis
    redis:
      namespace: secureone:session
      repository-type: indexed

  # Platform SMTP server until one is saved under Platform settings → Notifications (PlatformSmtpSettingsService).
  mail:
    host: ${SECUREONE_SMTP_HOST:}
    port: ${SECUREONE_SMTP_PORT:1025}
    username: ${SECUREONE_SMTP_USERNAME:}
    password: ${SECUREONE_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SECUREONE_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SECUREONE_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

  # Dev login user (replace with real user store in Phase 1)
  security:
    user:
      name: ${SECUREONE_DEV_USER:admin}
      password: ${SECUREONE_DEV_PASSWORD:admin}
    oauth2:
      authorizationserver:
        issuer: ${SECUREONE_ISSUER_URL:http://localhost:9000}
        # OAuth clients are loaded from application records (admin Applications API).

server:
  port: ${SECUREONE_PORT:9000}
  # X-Forwarded-For/-Proto are applied only from loopback (the console's own proxy) and the addresses in
  # SECUREONE_TRUSTED_PROXIES (see TrustedProxiesConfig), so clients cannot choose their own address.
  forward-headers-strategy: ${SECUREONE_FORWARD_HEADERS_STRATEGY:native}

secureone:
  environment: ${SECUREONE_ENV:development}
  database:
    # auto: upgrade the database at start-up. only: upgrade, then exit (an upgrade job before rollout).
    # validate: never change it; refuse to start while an upgrade is missing. See docs/26.
    migrate: ${SECUREONE_DB_MIGRATE:auto}
  # Tenant configuration files (YAML/JSON, a file or a directory) applied at every start-up. See docs/26.
  config-import: ${SECUREONE_CONFIG_IMPORT:}
  # Reverse proxies / load balancers whose X-Forwarded-For is believed: addresses or IPv4 /8 /16 /24 /32 ranges.
  trusted-proxies: ${SECUREONE_TRUSTED_PROXIES:}
  swagger-enabled: ${SECUREONE_SWAGGER_ENABLED:true}
  dev-auth-enabled: ${SECUREONE_DEV_AUTH_ENABLED:true}
  # Emergency platform login with the configured account (spring.security.user.*). Always available
  # while dev auth is on; in production enable only during an incident. Every use is audited.
  break-glass:
    enabled: ${SECUREONE_BREAK_GLASS_ENABLED:false}
  admin:
    # Console sign-in requires an authenticator-app code (TOTP) or a recovery code.
    mfa-required: ${SECUREONE_ADMIN_MFA_REQUIRED:true}
    # Console sessions end after this much inactivity, and at the absolute lifetime regardless.
    session-idle-timeout: ${SECUREONE_ADMIN_SESSION_IDLE:30m}
    session-max-lifetime: ${SECUREONE_ADMIN_SESSION_MAX:8h}
    break-glass-session-max-lifetime: ${SECUREONE_BREAK_GLASS_SESSION_MAX:1h}
  cors-allowed-origins: ${SECUREONE_CORS_ALLOWED_ORIGINS:}
  # Row-level security (V54, V61-V64): queries run as secureone_app and see only the request's
  # tenant, unless explicitly platform-scoped. "off" restores the legacy see-all fallback for
  # unscoped work; watch the "RLS unscoped" warnings before turning it off anywhere.
  rls:
    enforce: ${SECUREONE_RLS_ENFORCE:on}
  # Webhooks to localhost/private/metadata addresses are refused (SSRF). Enable only for local testing.
  webhooks:
    allow-private-targets: ${SECUREONE_WEBHOOKS_ALLOW_PRIVATE:false}
  public-base-url: ${SECUREONE_PUBLIC_BASE_URL:http://localhost:9000}
  # Where operators open the admin console. It is served by this server at /admin (see console: below).
  admin-web-url: ${SECUREONE_ADMIN_WEB_URL:${secureone.public-base-url}/admin}
  console:
    # Built console (Next.js standalone server.js): this server runs it on 127.0.0.1 and serves it at
    # /admin. The container image sets it; leave empty in development.
    dir: ${SECUREONE_CONSOLE_DIR:}
    port: ${SECUREONE_CONSOLE_PORT:3001}
    node-command: ${SECUREONE_CONSOLE_NODE:node}
    # Or a console already running elsewhere (development: http://localhost:3001 from `next dev`).
    upstream-url: ${SECUREONE_CONSOLE_UPSTREAM_URL:}
  # When MailHog/SMTP is down, log verification/reset links to the auth-server console (dev only).
  mail:
    log-links-when-smtp-unavailable: ${SECUREONE_MAIL_LOG_WHEN_UNAVAILABLE:true}
  password-expiry:
    scheduler-enabled: ${SECUREONE_PASSWORD_EXPIRY_SCHEDULER:true}
    check-cron: ${SECUREONE_PASSWORD_EXPIRY_CRON:0 0 */6 * * *}
  otp:
    pepper: ${SECUREONE_OTP_PEPPER:change-me-in-production}
  password:
    breach-check-enabled: ${SECUREONE_BREACH_CHECK_ENABLED:true}
  rate-limit:
    enabled: ${SECUREONE_RATE_LIMIT_ENABLED:true}
    login-per-minute: ${SECUREONE_RATE_LIMIT_LOGIN_PER_MINUTE:20}
    token-per-minute: ${SECUREONE_RATE_LIMIT_TOKEN_PER_MINUTE:60}
    forgot-password-per-minute: ${SECUREONE_RATE_LIMIT_FORGOT_PASSWORD_PER_MINUTE:5}
    otp-request-per-minute: ${SECUREONE_RATE_LIMIT_OTP_REQUEST_PER_MINUTE:10}
    admin-login-per-minute: ${SECUREONE_RATE_LIMIT_ADMIN_LOGIN_PER_MINUTE:10}
    signup-per-minute: ${SECUREONE_RATE_LIMIT_SIGNUP_PER_MINUTE:10}
    email-request-per-minute: ${SECUREONE_RATE_LIMIT_EMAIL_REQUEST_PER_MINUTE:5}

management:
  # Health, info and Prometheus on their own port (the image uses 9001; never publish it). Empty: same port as
  # the app (local development).
  server:
    port: ${SECUREONE_MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    mail:
      enabled: false

info:
  app:
    name: SecureOne Auth Server
    description: Centralized IAM platform — authorization server

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Required when disable-swagger-default-url is true — springdoc 3.x may omit urls[] from swagger-config.
    url: /v3/api-docs/all
    urls-primary-name: all
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
    doc-expansion: list
    groups-order: ASC
    config-url: /v3/api-docs/swagger-config
  show-actuator: false
  writer-with-order-by-keys: true
