<!DOCTYPE html>
<!--
  Layout of the pages SecureOne builds on the server: the consent screen, "this app cannot sign you in", email
  verified, expired sign-in link, and the short "Signing in…" pages of SAML. A theme replaces it with its own
  templates/page.html (every such page) or templates/<page>.html (one page; the names are in the theme guide).

  {{name}} is replaced with the value, HTML-escaped; {{{name}}} with the value as is (SecureOne builds and escapes
  it). Values: lang, page (consent, oauth-error, email-verified, email-verify-failed, magic-link-invalid,
  saml-error, saml-post), title, heading, content, head (SecureOne's scripts, when the page uses them).
-->
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{{title}} · SecureOne</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f7f7f8; color: #171717; line-height: 1.5; }
      main { max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 1.5rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      button { width: 100%; padding: 0.6rem; margin-top: 0.5rem; background: #4f46e5; color: #fff; border: 0;
        border-radius: 8px; font-weight: 600; cursor: pointer; font: inherit; }
      button.secondary { background: transparent; color: inherit; border: 1px solid #d1d5db; }
      ul.scopes { list-style: none; padding: 0; margin: 1rem 0; }
      ul.scopes li { padding: 0.4rem 0; border-bottom: 1px solid #f1f1f1; }
      .muted { color: #6b7280; font-size: 0.85rem; }
      .dev { margin-top: 1rem; padding: 0.8rem; border-radius: 8px; background: #fef3c7; font-size: 0.9rem; word-break: break-word; }
      code { font-size: 0.85em; }
      @media (prefers-color-scheme: dark) {
        body { background: #121216; color: #ededed; }
        .card { background: #1c1c24; border-color: #2a2a33; }
        ul.scopes li { border-color: #2a2a33; }
        .dev { background: #3b2f0b; }
      }
      html.so-branded .card { background: var(--so-surface); color: var(--so-text); }
    </style>
    {{{head}}}
  </head>
  <body class="so-page so-page-{{page}}">
    <main>
      <div class="card">
        <h1>{{heading}}</h1>
        {{{content}}}
      </div>
    </main>
  </body>
</html>
