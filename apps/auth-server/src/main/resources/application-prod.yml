# Production profile — Swagger and dev auth off; fail-fast checks run at startup.
secureone:
  environment: ${SECUREONE_ENV:production}
  dev-auth-enabled: ${SECUREONE_DEV_AUTH_ENABLED:false}
  # Database row-level security is enforced in production (see docs/26 and migrations V61-V64).
  rls:
    enforce: ${SECUREONE_RLS_ENFORCE:on}
  mail:
    log-links-when-smtp-unavailable: ${SECUREONE_MAIL_LOG_WHEN_UNAVAILABLE:false}
  rate-limit:
    login-per-minute: 10
    token-per-minute: 30
    forgot-password-per-minute: 3
    otp-request-per-minute: 5
    admin-login-per-minute: 5

# API docs (Swagger UI, /v3/api-docs) follow SECUREONE_ENV, not this profile: off when it is production
# unless SECUREONE_SWAGGER_ENABLED=true (see application.yml). They describe the API only (no data, no
# secrets); every call still needs its normal authentication.

logging:
  level:
    org.hibernate.SQL: warn
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
