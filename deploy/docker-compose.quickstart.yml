# SecureOne quickstart: the whole product on one machine in a few minutes, for evaluation.
#
#   docker compose -f deploy/docker-compose.quickstart.yml up --build
#
# Then open http://localhost:9000/admin and sign in on the Platform operator tab as admin@example.com with
# the password below (QUICKSTART_ADMIN_PASSWORD to choose another).
# The emergency account admin / admin also works (development mode).
# Outgoing email lands in MailHog: http://localhost:8025.
# Ports in use? QUICKSTART_PORT=9300 MAILHOG_PORT=8125 docker compose -f deploy/docker-compose.quickstart.yml up --build
#
# NOT for production: development mode (emergency admin/admin account, API docs on, relaxed checks)
# and throw-away passwords. For production see docs/24-deployment-image-env-and-enterprise.md.
# (deploy/docker-compose.yml only starts PostgreSQL, Redis and MailHog for local development.)

# Own project name: deploy/docker-compose.yml (dev) lives in the same folder and has services with the same names;
# without this, starting one would replace the other's containers.
name: secureone-quickstart

services:
  secureone:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: secureone/secureone:quickstart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${QUICKSTART_PORT:-9000}:9000"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SECUREONE_ENV: development
      SECUREONE_ISSUER_URL: http://localhost:${QUICKSTART_PORT:-9000}
      SECUREONE_PUBLIC_BASE_URL: http://localhost:${QUICKSTART_PORT:-9000}
      SECUREONE_DB_URL: jdbc:postgresql://postgres:5432/secureone?currentSchema=platform
      SECUREONE_DB_USERNAME: secureone
      SECUREONE_DB_PASSWORD: quickstart-only
      SECUREONE_REDIS_URL: redis://redis:6379
      SECUREONE_SMTP_HOST: mailhog
      SECUREONE_SMTP_PORT: "1025"
      SECUREONE_OTP_PEPPER: quickstart-only-pepper
      # First platform operator, created at the first start (ignored once one exists).
      SECUREONE_BOOTSTRAP_ADMIN_EMAIL: ${QUICKSTART_ADMIN_EMAIL:-admin@example.com}
      SECUREONE_BOOTSTRAP_ADMIN_PASSWORD: ${QUICKSTART_ADMIN_PASSWORD:-Quickstart-Admin-2026!}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secureone
      POSTGRES_USER: secureone
      POSTGRES_PASSWORD: quickstart-only
    volumes:
      - quickstart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureone -d secureone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_PORT:-8025}:8025"

volumes:
  quickstart-pgdata:
