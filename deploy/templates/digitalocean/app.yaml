# SecureOne on DigitalOcean App Platform: the published image with a managed PostgreSQL and a managed Valkey (Redis).
#
# 1. Create the two databases in the same region as the app (here nyc1):
#      doctl databases create secureone-db --engine pg --version 16 --region nyc1 --size db-s-1vcpu-1gb
#      doctl databases create secureone-cache --engine valkey --region nyc1 --size db-s-1vcpu-1gb
# 2. Replace REPLACE_WITH_ENCRYPTION_KEY below with the output of:  openssl rand -base64 32
#    Keep that key safe: without it, a database backup cannot be used.
# 3. doctl apps create --spec app.yaml
# 4. Open the app's URL + /admin/setup. To use your own domain, add it under domains below (or in the
#    control panel); SecureOne then follows the app's address (APP_URL).

name: secureone
region: nyc

services:
  - name: secureone
    image:
      registry_type: DOCKER_HUB
      registry: dmtavs0108
      repository: secureone
      tag: 1.1.1
    http_port: 9000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    health_check:
      http_path: /api/info
      initial_delay_seconds: 60
    envs:
      - key: SECUREONE_PUBLIC_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: SECUREONE_DB_URL
        scope: RUN_TIME
        value: jdbc:postgresql://${db.HOSTNAME}:${db.PORT}/${db.DATABASE}?sslmode=require&currentSchema=platform
      - key: SECUREONE_DB_USERNAME
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: SECUREONE_DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${db.PASSWORD}
      # rediss:// (TLS) URL of the Valkey cluster.
      - key: SECUREONE_REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: ${cache.DATABASE_URL}
      - key: SECUREONE_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_ENCRYPTION_KEY
      # App Platform's proxy: lets SecureOne see each visitor's own address (rate limits, IP rules).
      - key: SECUREONE_TRUSTED_PROXIES
        scope: RUN_TIME
        value: 10.0.0.0/8

databases:
  - name: db
    engine: PG
    production: true
    cluster_name: secureone-db
    db_name: defaultdb
  - name: cache
    engine: VALKEY
    production: true
    cluster_name: secureone-cache
