{{- if .Values.migrationJob.enabled }}
# Upgrades the database once, before the new pods start (docs/26). The pods then only check that the
# database matches their release (SECUREONE_DB_MIGRATE=validate). A failed job stops the upgrade and
# the old pods keep running.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app.kubernetes.io/name: secureone
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrationJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secureone
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: {{ include "secureone.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "secureone.env" . | nindent 10 }}
            - name: SECUREONE_DB_MIGRATE
              value: only
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
{{- end }}
