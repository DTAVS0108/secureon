{{- if not .Values.existingSecret }}
{{- $name := printf "%s-secrets" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Created once and then kept: a hook (so it exists before the migration job) that Helm never deletes. The
# encryption key must never change: stored secrets cannot be read without it, so it is generated only the first time.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: secureone
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "SECUREONE_ENCRYPTION_KEY") }}
  SECUREONE_ENCRYPTION_KEY: {{ index $existing.data "SECUREONE_ENCRYPTION_KEY" }}
  {{- else }}
  SECUREONE_ENCRYPTION_KEY: {{ printf "base64:%s" (randBytes 32) | b64enc }}
  {{- end }}
  {{- if .Values.database.password }}
  SECUREONE_DB_PASSWORD: {{ .Values.database.password | b64enc }}
  {{- else if and $existing (index $existing.data "SECUREONE_DB_PASSWORD") }}
  SECUREONE_DB_PASSWORD: {{ index $existing.data "SECUREONE_DB_PASSWORD" }}
  {{- else }}
  {{- fail "database.password is required (or set existingSecret)" }}
  {{- end }}
{{- end }}
