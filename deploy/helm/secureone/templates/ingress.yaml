{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-auth-server
                port:
                  number: {{ .Values.authServer.service.port }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-admin-web
                port:
                  number: {{ .Values.adminWeb.service.port }}
{{- end }}
