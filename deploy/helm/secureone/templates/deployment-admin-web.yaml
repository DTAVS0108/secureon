apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-admin-web
  labels:
    app.kubernetes.io/name: secureone-admin-web
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.adminWeb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: secureone-admin-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secureone-admin-web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: admin-web
          image: "{{ .Values.adminWeb.image.repository }}:{{ .Values.adminWeb.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.adminWeb.service.port }}
          env:
            {{- range $key, $value := .Values.adminWeb.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: AUTH_SERVER_URL
              value: "http://{{ .Release.Name }}-auth-server:{{ .Values.authServer.service.port }}"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.adminWeb.resources | nindent 12 }}
