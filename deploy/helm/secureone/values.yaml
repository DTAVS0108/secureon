# Default values for the SecureOne Helm chart.
# Override in an environment-specific values file or with --set.

global:
  imagePullPolicy: IfNotPresent

image:
  repository: dmtavs0108/secureone
  # Defaults to the chart's appVersion. Pin a version; never deploy "latest" to production.
  tag: ""

# Two or more replicas: sessions and caches live in Redis, generated keys are created once (cluster lock).
replicaCount: 2

service:
  port: 9000

# Health, info and Prometheus (SECUREONE_MANAGEMENT_PORT). Used by the probes and the metrics scraper inside
# the cluster; not part of the Service or the Ingress.
management:
  port: 9001

resources:
  requests:
    cpu: 300m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1536Mi

# The address users and applications open (https). Also the token issuer. Usually the ingress host.
publicUrl: https://id.example.com

# Your PostgreSQL (an empty database and a user that owns it).
database:
  url: jdbc:postgresql://postgres:5432/secureone?currentSchema=platform
  username: secureone
  # Stored in the Secret the chart creates. Leave empty when existingSecret provides SECUREONE_DB_PASSWORD.
  password: ""

# Your Redis. With a password: redis://:<password>@host:6379 (or put SECUREONE_REDIS_URL in existingSecret).
redis:
  url: redis://redis:6379

# Secrets. Empty (the default): the chart creates "<release>-secrets" once, with a random encryption key and the
# database password above. It is kept on upgrades and on `helm uninstall` (without the key, a database backup
# cannot be restored): back it up with `kubectl get secret <release>-secrets -o yaml`. The token signing key and
# the code pepper are created by SecureOne and stored encrypted in the database.
# Or name a Secret of your own with any SECUREONE_* variables (at least SECUREONE_ENCRYPTION_KEY and
# SECUREONE_DB_PASSWORD). The settings above win over the same names in that Secret: set them to "" when the
# Secret provides them (for example a Redis URL with a password).
existingSecret: ""

# More settings as plain variables (docs: Deployment, "All settings").
env:
  # The ingress controller's pod range: only it may send X-Forwarded-For (addresses or /8, /16, /24, /32 ranges).
  SECUREONE_TRUSTED_PROXIES: "10.0.0.0/8"

# Database upgrades (docs/install/configuration-and-upgrades.md). Enabled: a Job upgrades the database once before every install and upgrade
# (helm hook), and the pods refuse to start if it did not run. Disabled: each pod upgrades at start.
migrationJob:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

# Configuration as code (docs/install/configuration-and-upgrades.md): tenant configuration files applied at every start-up. Name a ConfigMap
# whose keys are the files (for example tenant-a.yaml); it is mounted at /etc/secureone/config.
configImport:
  configMap: ""

ingress:
  enabled: false
  className: nginx
  # One host serves everything: OAuth/OIDC, SAML, SCIM, hosted sign-in, APIs and the console at /admin.
  host: id.example.com
  tlsSecretName: secureone-tls

metrics:
  prometheusScrape: true
  path: /actuator/prometheus
