# SecureOne public website on http://localhost:8080 (separate from the product).
#
#   docker compose -f deploy/docker-compose.website.yml up -d --build
#
# WEBSITE_PORT changes the published port; SITE_URL the address used in canonical links and the sitemap.
name: secureone-website

services:
  website:
    build:
      context: ..
      dockerfile: deploy/website.Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    image: secureone-website:local
    container_name: secureone-website
    ports:
      - "${WEBSITE_PORT:-8080}:8080"
    restart: unless-stopped
