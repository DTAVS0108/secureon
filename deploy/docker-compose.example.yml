# SecureOne on one server, everything given when the containers are created (docs/24):
# settings as environment variables, secrets as files, the first admin, tenant files, daily backups.
#
#   1. sh generate-secrets.sh owner@example.com      (creates ./secrets/; keep a copy elsewhere)
#   2. Optional: tenant configuration files in ./tenants/ (docs/26).
#   3. ADMIN_EMAIL=owner@example.com PUBLIC_URL=https://id.example.com docker compose -f docker-compose.example.yml up -d
#   4. Sign in at $PUBLIC_URL/admin (Platform operator tab) with the password in secrets/admin_password:
#      you choose a new password and add an authenticator app. Then you may delete secrets/admin_password.
#
# Production mode (the default) needs https: put a TLS reverse proxy or load balancer in front of port 9000.
# To try it locally over http:  SECUREONE_ENV=development PUBLIC_URL=http://localhost:9000 docker compose ... up -d

name: secureone

services:
  secureone:
    image: ${SECUREONE_IMAGE:-dmtavs0108/secureone:0.3.37}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-9000}:9000" # the app and the console (/admin); 9001 (health, metrics) stays internal
    mem_limit: 1536m           # Java uses 75% of it; give at least 1 GB
    environment:
      SECUREONE_ENV: ${SECUREONE_ENV:-production}
      SECUREONE_ISSUER_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://id.example.com}
      SECUREONE_PUBLIC_BASE_URL: ${PUBLIC_URL}
      # Your reverse proxy's address or range (/8, /16, /24, /32): only it may send X-Forwarded-For. docs/runbooks/custom-domain.md
      SECUREONE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SECUREONE_DB_URL: jdbc:postgresql://postgres:5432/secureone?currentSchema=platform
      SECUREONE_DB_USERNAME: secureone
      SECUREONE_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SECUREONE_CONFIG_IMPORT: /etc/secureone/tenants
      # Email (or set it later in the console: Platform settings -> Notifications)
      SECUREONE_SMTP_HOST: ${SMTP_HOST:-}
      SECUREONE_SMTP_PORT: ${SMTP_PORT:-587}
      SECUREONE_SMTP_USERNAME: ${SMTP_USERNAME:-}
      SECUREONE_SMTP_AUTH: ${SMTP_AUTH:-false}
      SECUREONE_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # Optional (docs/24, "All settings"):
      # SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: "10\\.\\d+\\.\\d+\\.\\d+|203\\.0\\.113\\.\\d+"  # proxy not on a private network
      # LOGGING_LEVEL_COM_SECUREONE: DEBUG
      # SECUREONE_ADMIN_SESSION_IDLE: 30m
    # Each secret is a file /run/secrets/<name>; the name is the setting it fills.
    secrets:
      - SECUREONE_DB_PASSWORD
      - SECUREONE_REDIS_URL
      - SECUREONE_ENCRYPTION_KEY
      - SECUREONE_OTP_PEPPER
      - SECUREONE_JWK_PRIVATE_KEY_PEM
      - SECUREONE_BOOTSTRAP_ADMIN_PASSWORD
      # - SECUREONE_SMTP_PASSWORD           # add the secret below too
      # - SECUREONE_SAML_SP_KEY_PEM         # only for SAML sign-in with a certificate you control
      # - SECUREONE_SAML_SP_CERT_PEM
    volumes:
      - ./tenants:/etc/secureone/tenants:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secureone
      POSTGRES_USER: secureone
      POSTGRES_PASSWORD_FILE: /run/secrets/SECUREONE_DB_PASSWORD
    secrets:
      - SECUREONE_DB_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data      # the data itself (survives container replacement; not a backup)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureone -d secureone"]
      interval: 5s
      retries: 20

  # Daily database backup into ./backups (kept BACKUP_KEEP_DAYS days). Copy ./backups off this server too.
  # Restore: docs/24 "Backups".
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      secureone:
        condition: service_healthy   # first dump once SecureOne has created its tables
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
    secrets:
      - SECUREONE_DB_PASSWORD
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/SECUREONE_DB_PASSWORD)"
        while true; do
          file="/backups/secureone-$$(date -u +%Y%m%d-%H%M%S).dump"
          if pg_dump -h postgres -U secureone -d secureone -Fc -f "$$file.part"; then
            mv "$$file.part" "$$file"; echo "backup written: $$file"
          else
            rm -f "$$file.part"; echo "backup FAILED" >&2
          fi
          find /backups -name 'secureone-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_EVERY_SECONDS"
        done

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password from the secret; append-only file on a volume, so a restart keeps everyone signed in.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes --save 60 1000"]
    secrets:
      - redis_password
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping"]
      interval: 5s
      retries: 20

secrets:
  SECUREONE_DB_PASSWORD:
    file: ./secrets/db_password
  redis_password:
    file: ./secrets/redis_password
  SECUREONE_REDIS_URL:
    file: ./secrets/redis_url                # redis://:<redis_password>@redis:6379
  SECUREONE_ENCRYPTION_KEY:
    file: ./secrets/encryption_key
  SECUREONE_OTP_PEPPER:
    file: ./secrets/otp_pepper
  SECUREONE_JWK_PRIVATE_KEY_PEM:
    file: ./secrets/jwk_private_key
  SECUREONE_BOOTSTRAP_ADMIN_PASSWORD:
    file: ./secrets/admin_password
  # SECUREONE_SMTP_PASSWORD:
  #   file: ./secrets/smtp_password

volumes:
  pgdata:
  redisdata:
