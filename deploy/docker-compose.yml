# Development infrastructure (project name pinned; the quickstart in this folder uses its own).
name: deploy

services:
  postgres:
    image: postgres:16-alpine
    container_name: secureone-postgres
    environment:
      POSTGRES_DB: secureone
      POSTGRES_USER: secureone
      POSTGRES_PASSWORD: secureone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureone -d secureone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: secureone-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outbound email in dev — web UI at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: secureone-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
