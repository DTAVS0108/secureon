name: Publish SDK

# Publishes @secureone/client to npm when a tag such as sdk-v0.2.0 is pushed.
# Needs the repository secret NPM_TOKEN (an npm automation token for the @secureone organisation).
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/secureone-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "Tag $tag does not match package.json version $version"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
